<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="El programa práctico de educación financiera para que niños y jóvenes de 3 a 16+ años aprendan a ahorrar, presupuestar e invertir su dinero de forma divertida y sin clases complejas." />
    <title>Pequeño Inversionista | Educación Financiera para Niños</title>

    <!-- Critical CSS for Instant Hero Painting & Video Container Dimensions -->
    <style>
      :root {
        --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --color-emerald-500: #10b981;
        --color-emerald-600: #059669;
        --color-slate-900: #0f172a;
        --color-slate-800: #1e293b;
        --color-slate-600: #475569;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #1e293b;
        font-family: var(--font-sans);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      /* Critical Hero & Video placeholder styles to guarantee zero layout shift */
      .hero-section {
        position: relative;
        overflow: hidden;
        background-color: #ffffff;
        padding-top: 2rem;
        padding-bottom: 4rem;
      }
      .video-hero-box {
        position: relative;
        width: 100%;
        max-width: 42rem;
        margin-left: auto;
        margin-right: auto;
        aspect-ratio: 16 / 9;
        background-color: #f1f5f9;
        border-radius: 1rem;
        overflow: hidden;
      }
    </style>

    <!-- Font Server Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Asynchronous Non-Blocking Google Fonts (media='print' onload="this.media='all'") -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" />
    </noscript>

    <!-- Meta Pixel Preconnect -->
    <link rel="preconnect" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />

    <!-- Image CDN Preconnect & DNS Prefetch for Fast Asset Loading -->
    <link rel="preconnect" href="https://i.postimg.cc" crossorigin />
    <link rel="dns-prefetch" href="https://i.postimg.cc" />

    <!-- Application Module Script -->
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!-- App Root Container -->
    <div id="root"></div>

    <!-- Meta Pixel Code (deferred after body rendering) -->
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '27841671172141787');
        fbq('track', 'PageView');
      });
    </script>
    <noscript>
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=27841671172141787&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>
  </body>
</html>
